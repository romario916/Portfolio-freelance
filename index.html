
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link rel="icon" type="image/svg+xml" href="profil.webp" />

    <!-- SEO principal -->
    <title>
      Romario | Développeur Web Freelance React & TypeScript
    </title>

    <meta
      name="description"
      content="Romario, développeur web freelance spécialisé en React, TypeScript et Tailwind CSS. Création de sites vitrines modernes, responsive et professionnels pour entreprises et commerces."
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="Romario" />

    <meta name="theme-color" content="#ffffff" />

    <meta
      name="keywords"
      content="développeur web freelance, développeur React, développeur frontend, création site vitrine, site web professionnel, TypeScript, Tailwind CSS, développeur Madagascar, développeur web à distance"
    />

    <!-- Langue et zone géographique -->
    <meta name="language" content="French" />

    <!-- Open Graph : aperçu lors du partage -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="fr_FR" />

    <meta
      property="og:title"
      content="Romario | Développeur Web Freelance"
    />

    <meta
      property="og:description"
      content="Je crée des sites web modernes, responsive et professionnels pour les entreprises, commerces et indépendants."
    />

    <meta
      property="og:url"
      content="https://ton-domaine.com/"
    />

    <meta
      property="og:image"
      content="https://ton-domaine.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Portfolio professionnel de Romario, développeur web freelance"
    />

    <meta property="og:site_name" content="Portfolio Romario" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Romario | Développeur Web Freelance"
    />

    <meta
      name="twitter:description"
      content="Création de sites vitrines professionnels avec React, TypeScript et Tailwind CSS."
    />

    <meta
      name="twitter:image"
      content="https://ton-domaine.com/og-image.jpg"
    />

    <!-- URL canonique : à remplacer par ton vrai domaine -->
    <link
      rel="canonical"
      href="https://ton-domaine.com/"
    />

    <!-- Icône du site -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Connexions anticipées aux polices si Google Fonts est utilisé -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
